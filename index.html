<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>APEX</title>
  <meta name="theme-color" content="#000000">
  <meta name="description" content="APEX · tu entrenador y nutricionista personal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=6">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=6">
  <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap">
  <link rel="stylesheet" href="style.css?v=2.18.0">
</head>
<body data-sec="nutri">
  <!-- Pantalla de carga: solo la palabra APEX (letras que entran a velocidad) + rueda de 3 s con los colores del icono -->
  <div id="splash" aria-hidden="true">
    <span class="sp-nombre"><i>A</i><i>P</i><i>E</i><i>X</i></span>
    <svg class="sp-ring" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="spGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ff6a00"/><stop offset=".5" stop-color="#ec288c"/><stop offset="1" stop-color="#2f7bff"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#1a1a1a" stroke-width="6"/>
      <circle class="sp-arc" cx="50" cy="50" r="42" fill="none" stroke="url(#spGrad)" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>
  <header class="top">
    <div>
      <p class="eyebrow" id="fecha">—</p>
      <h1 id="titulo"><span class="sec-txt">Nutrición</span></h1>
      <p class="goal" id="goal" hidden></p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-sync" aria-label="Actualizar">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></svg>
      </button>
      <button class="icon-btn" id="btn-ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="v-nutri" class="view"></section>
    <section id="v-run" class="view" hidden></section>
    <section id="v-fuerza" class="view" hidden></section>
    <section id="v-ajustes" class="view" hidden></section>
  </main>

  <button class="fab" id="fab" aria-label="Añadir">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabs">
    <i class="tab-ind" id="tab-ind" aria-hidden="true"></i>
    <!-- Solo símbolos: plato con cubiertos, corredor y mancuerna (el nombre va en la cabecera) -->
    <button data-tab="nutri" class="on" aria-label="Nutrición">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="3.4" opacity=".55"/><path d="M2.3 3.5v3.5M3.8 3.5v3.5M2.3 7c0 1.2.6 1.7 1.5 1.7M3 8.5v12M21.7 3.5c-1.4 1.2-2 3.6-2 7h2M21.7 3.5v17"/></svg>
    </button>
    <button data-tab="run" aria-label="Running">
      <svg viewBox="0 0 24 24"><circle cx="15.5" cy="4" r="2" fill="currentColor" stroke="none"/><path d="M14 7.5l-3 6 3.5 2.5-1.5 5M11 13.5l-4 2-2.5-1M8 10l3.5-2.5 3.5 1.5 2 3"/></svg>
    </button>
    <button data-tab="fuerza" aria-label="Fuerza">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
    </button>
  </nav>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="sheet-title">Añadir</h2>
        <button class="icon-btn" id="sheet-close" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="inmersion" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js?v=2.18.0"></script>
</body>
</html>
