<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agente Running</title>
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Nutrición y running personal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=3">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=3">
  <link rel="stylesheet" href="style.css?v=2.3.0">
</head>
<body data-sec="nutri">
  <!-- Pantalla de carga: monograma AP en blanco + rueda de 3 s con los colores del icono -->
  <div id="splash" aria-hidden="true">
    <svg class="sp-logo" viewBox="0 0 100 100" overflow="visible">
      <defs>
        <linearGradient id="spNeon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80" y2="0">
          <stop offset="0" stop-color="#ff6a00"/><stop offset=".55" stop-color="#ec288c"/><stop offset="1" stop-color="#2f7bff"/>
        </linearGradient>
        <filter id="spBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <g transform="translate(50 50) skewX(-14.6) translate(-50 -50)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- estelas de velocidad y resplandor en neón -->
        <g stroke="url(#spNeon)" class="sp-estela">
          <path d="M6 40 H19 M2 50 H17 M8 60 H20" stroke-width="2.6"/>
          <g filter="url(#spBlur)" stroke-width="5" opacity=".8">
            <path d="M20 70 L33 30 L46 70 M53 70 V30 H62 A11 11 0 0 1 62 52 H53" opacity=".5"/>
            <path d="M25 70 L38 30 L51 70 M30 56 H46 M58 70 V30 H67 A11 11 0 0 1 67 52 H58"/>
          </g>
        </g>
        <!-- letras en blanco -->
        <path d="M25 70 L38 30 L51 70 M30 56 H46 M58 70 V30 H67 A11 11 0 0 1 67 52 H58" stroke="#fff" stroke-width="4.2"/>
      </g>
    </svg>
    <svg class="sp-ring" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="spGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ff6a00"/><stop offset=".5" stop-color="#ec288c"/><stop offset="1" stop-color="#2f7bff"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#1a1a1a" stroke-width="6"/>
      <circle class="sp-arc" cx="50" cy="50" r="42" fill="none" stroke="url(#spGrad)" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>
  <header class="top">
    <div>
      <p class="eyebrow" id="fecha">—</p>
      <h1 id="titulo">Nutrición</h1>
      <p class="goal" id="goal" hidden></p>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-sync" aria-label="Actualizar">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></svg>
      </button>
      <button class="icon-btn" id="btn-ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="v-nutri" class="view"></section>
    <section id="v-run" class="view" hidden></section>
    <section id="v-fuerza" class="view" hidden></section>
    <section id="v-ajustes" class="view" hidden></section>
  </main>

  <button class="fab" id="fab" aria-label="Añadir">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabs">
    <button data-tab="nutri" class="on">
      <svg viewBox="0 0 24 24"><path d="M7 3v8a3 3 0 0 0 3 3v7M7 3v5M10 3v5M17 3c-2 2-3 5-3 8h3v10"/></svg>
      <span>Nutrición</span>
    </button>
    <button data-tab="run">
      <svg viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v4M6 12l3-4 4 1 2 4 3 1M11 15l-2-3"/></svg>
      <span>Running</span>
    </button>
    <button data-tab="fuerza">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span>Fuerza</span>
    </button>
  </nav>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="sheet-title">Añadir</h2>
        <button class="icon-btn" id="sheet-close" aria-label="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="inmersion" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js?v=2.3.0"></script>
</body>
</html>
